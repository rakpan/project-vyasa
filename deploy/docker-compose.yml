services:
  # SGLang - Brain (logic/routing)
  # Unified TEXT_MODEL configuration (same model as Worker, service-level redundancy)
  # Quality-first, stability-first baseline for nvidia/Llama-3_3-Nemotron-Super-49B-v1_5 on DGX Spark:
  #
  # Baseline rationale:
  # - context-length 65536: 64K context supports journal workflows (paper sections + extracted claims + instructions)
  #   without aggressive truncation. Prioritizes quality over throughput.
  # - max-running-requests 1: Maximizes KV cache per request and simplifies scheduling for stability.
  #   Reduces contention and OOM risk. Quality-first approach favors single-request processing.
  # - mem-fraction-static 0.50: Conservative DGX Spark baseline, leaves headroom for OS/ArangoDB/Qdrant.
  # - quantization int8: Balanced precision/performance, optimized for Nemotron architecture.
  # - tp-size 1: Single tensor parallelism for stability.
  #
  # Staged tuning rules (DO NOT apply without documentation and metrics):
  # - Increase max-running-requests only if: KV cache fill < 80%, queue depth < 2, zero watchdog restarts over 24h.
  # - Increase context-length beyond 64K only if: UMA/VRAM pressure < 85%, sustained KV cache headroom observed.
  # - Adjust mem-fraction-static only if: UMA utilization < 80% and VRAM headroom > 15% under peak load.
  # - Any tuning must be staged: change one parameter, observe for 48h, document metrics, then consider next.
  #
  # Monitoring: Watch KV cache fill %, queue depth, watchdog restarts, UMA/VRAM pressure via observability endpoints.
  cortex-brain:
    image: ${CORTEX_IMAGE}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids must match NVIDIA_VISIBLE_DEVICES (set in environment section)
              # For multi-GPU, manually update to array format: ['0', '1']
              device_ids: ['0']
              capabilities: [gpu]
    command: python3 -m sglang.launch_server --model-path ${TEXT_MODEL_ID:-${BRAIN_MODEL_PATH:-nvidia/Llama-3_3-Nemotron-Super-49B-v1_5}} --host 0.0.0.0 --port 30000 --tp-size 1 --quantization petit_nvfp4 --mem-fraction-static 0.50 --max-running-requests 1 --context-length 65536 --trust-remote-code --attention-backend flashinfer
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=${TEXT_GPU_IDS:-0}
      - HF_HOME=/raid/vyasa/hf_cache
    cpuset: "10-19"
    shm_size: "16gb"
    mem_limit: "64g"
    ports:
      - "${PORT_BRAIN}:30000"
    restart: unless-stopped
    volumes:
      - /raid/vyasa/hf_cache:/raid/vyasa/hf_cache
      - /raid/vyasa/model_cache:/root/.cache/huggingface
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/30000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SGLang - Worker (extraction/cartographer)
  # Unified TEXT_MODEL configuration (same model as Brain, service-level redundancy)
  # Quality-first, stability-first baseline for nvidia/Llama-3_3-Nemotron-Super-49B-v1_5 on DGX Spark:
  #
  # Baseline rationale (identical to Brain for service-level redundancy):
  # - context-length 65536: 64K context supports journal workflows (paper sections + extracted claims + instructions)
  #   without aggressive truncation. Prioritizes quality over throughput.
  # - max-running-requests 1: Maximizes KV cache per request and simplifies scheduling for stability.
  #   Reduces contention and OOM risk. Quality-first approach favors single-request processing.
  # - mem-fraction-static 0.50: Conservative DGX Spark baseline, leaves headroom for OS/ArangoDB/Qdrant.
  # - quantization int8: Balanced precision/performance, optimized for Nemotron architecture.
  # - tp-size 1: Single tensor parallelism for stability.
  #
  # Staged tuning rules (DO NOT apply without documentation and metrics):
  # - Increase max-running-requests only if: KV cache fill < 80%, queue depth < 2, zero watchdog restarts over 24h.
  # - Increase context-length beyond 64K only if: UMA/VRAM pressure < 85%, sustained KV cache headroom observed.
  # - Adjust mem-fraction-static only if: UMA utilization < 80% and VRAM headroom > 15% under peak load.
  # - Any tuning must be staged: change one parameter, observe for 48h, document metrics, then consider next.
  #
  # Monitoring: Watch KV cache fill %, queue depth, watchdog restarts, UMA/VRAM pressure via observability endpoints.
  cortex-worker:
    image: ${CORTEX_IMAGE}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids must match NVIDIA_VISIBLE_DEVICES (set in environment section)
              # For multi-GPU, manually update to array format: ['0', '1']
              device_ids: ['0']
              capabilities: [gpu]
    command: python3 -m sglang.launch_server --model-path ${TEXT_MODEL_ID:-${WORKER_MODEL_PATH:-nvidia/Llama-3_3-Nemotron-Super-49B-v1_5}} --host 0.0.0.0 --port 30001 --tp-size 1 --quantization petit_nvfp4 --mem-fraction-static 0.50 --max-running-requests 1 --context-length 65536 --trust-remote-code --attention-backend flashinfer
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${TEXT_GPU_IDS:-0}
      - HF_HOME=/raid/vyasa/hf_cache
    cpuset: "10-19"
    shm_size: "16gb"
    mem_limit: "32g"
    ports:
      - "${PORT_WORKER}:30001"
    restart: unless-stopped
    volumes:
      - /raid/vyasa/hf_cache:/raid/vyasa/hf_cache
      - /raid/vyasa/model_cache:/root/.cache/huggingface
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/30001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # SGLang - Vision (Optional Accelerator)
  # Safety-first configuration for Qwen/Qwen2-VL-7B-Instruct on DGX Spark:
  # - quantization int8: Conservative quantization for vision models (balanced precision/performance)
  # - context-length 8192: Explicit safety cap prevents pathological OCR-heavy or high-resolution page workloads.
  #   This cap ensures Vision service remains stable when processing dense visual content.
  # - tp-size 1: Single-GPU tensor parallelism (default). Single GPU via VISION_GPU_IDS (default: "0").
  #   Multi-GPU is optional: set VISION_GPU_IDS="0,1" and update tp-size to 2 if needed.
  # - mem-fraction-static 0.75: Conservative memory allocation for vision workloads.
  # - max-running-requests 2: Low concurrency to prevent UMA spikes.
  # Note: Keep vision quantization conservative and avoid experimental backends.
  # 
  # Vision is OPTIONAL and disabled by default (profiles: ["vision"]).
  # To enable: docker compose --profile vision up -d cortex-vision
  # To disable: docker compose stop cortex-vision (reclaims GPU memory)
  # The orchestrator handles vision unavailability gracefully (see VISION_ENABLED config).
  cortex-vision:
    profiles: ["vision"]
    image: ${CORTEX_IMAGE}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids must match NVIDIA_VISIBLE_DEVICES (set in environment section)
              # For multi-GPU, manually update to array format: ['0', '1']
              device_ids: ['0']
              capabilities: [gpu]
    command: python3 -m sglang.launch_server --model-path ${VISION_MODEL_ID:-${VISION_MODEL_PATH:-Qwen/Qwen2-VL-7B-Instruct}} --host 0.0.0.0 --port 30002 --tp-size 1 --quantization w8a8_int8 --mem-fraction-static 0.75 --max-running-requests 2 --context-length 8192
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${VISION_GPU_IDS:-0}
      - HF_HOME=/raid/vyasa/hf_cache
    cpuset: "10-19"
    shm_size: "16gb"
    ports:
      - "${PORT_VISION}:30002"
    restart: unless-stopped
    volumes:
      - /raid/vyasa/hf_cache:/raid/vyasa/hf_cache
      - /raid/vyasa/model_cache:/root/.cache/huggingface
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/30002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ArangoDB - Graph
  graph:
    image: ${MEMORY_IMAGE}
    cpuset: "0-9"
    ports:
      - "${PORT_MEMORY}:${PORT_MEMORY}"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    volumes:
      - /raid/vyasa/arangodb:/var/lib/arangodb3
      - ./scripts/arango-init.js:/docker-entrypoint-initdb.d/arango-init.js:ro
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${PORT_MEMORY}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Qdrant - Vector DB
  vector:
    image: ${VECTOR_IMAGE}
    cpuset: "0-9"
    ports:
      - "${PORT_VECTOR}:${PORT_VECTOR}"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - /raid/vyasa/qdrant:/qdrant/storage
      - ./scripts/qdrant-init.sh:/scripts/qdrant-init.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      /qdrant/qdrant &
      PID=$$!
      sleep 5
      /bin/sh /scripts/qdrant-init.sh
      wait $$PID
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${PORT_VECTOR}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Next.js Console
  console:
    build:
      context: ../src/console
      dockerfile: ${CONSOLE_DOCKERFILE:-Dockerfile.dev}
    cpuset: "0-9"
    ports:
      - "${PORT_CONSOLE}:${PORT_CONSOLE}"
    volumes:
      # Mount source code for development mode with hot reload
      - ../src/console:/app:rw
      # Use named volume for node_modules to avoid overwriting with host directory
      - console_node_modules:/app/node_modules
      # Mount deploy directory for accessing configuration files (forbidden_vocab.yaml, etc.)
      # Note: docker-compose is run from deploy/ directory, so we mount the current directory
      # Mount to /app/deploy-config to avoid conflicts with console's /app directory
      - .:/app/deploy-config:ro
    environment:
      - NODE_ENV=${CONSOLE_NODE_ENV:-${NODE_ENV:-production}}
      - NEXT_PUBLIC_API_URL=http://localhost:${PORT_BRAIN}/v1
      - CORTEX_SERVICE_URL=http://cortex-brain:30000
      - MEMORY_SERVICE_URL=http://graph:${PORT_MEMORY}
      - SENTENCE_TRANSFORMER_URL=http://embedder:30010
      - QDRANT_URL=http://vector:${PORT_VECTOR}
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator:8000
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - ARANGODB_DB=${GRAPH_DB_NAME}
      - ARANGODB_USER=${ARANGODB_USER}
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD}
      - NEXTAUTH_SECRET=${CONSOLE_SECRET}
      - NEXTAUTH_URL=http://localhost:${PORT_CONSOLE}
      - AUTH_TRUST_HOST=true
    depends_on:
      - cortex-brain
      - graph
      - vector
    networks:
      - vyasa-net

  # Embedder (Sentence Transformers)
  # Simple and deterministic embedding service:
  # - Model: nvidia/nv-embedqa-e5-v5 (1024-dimensional embeddings)
  # - Dimension guardrail: EMBEDDING_DIMENSION=1024 enforced by orchestrator startup validation
  # - Chunking responsibility: Upstream services (orchestrator) must chunk text before embedding
  # - No quantization or performance tuning: Service remains simple and deterministic
  # - GPU: Defaults to CPU (no GPU pinning) to avoid VRAM contention with TEXT/VISION services
  #   To enable GPU: Set EMBEDDER_GPU_IDS in .env and uncomment runtime/device_ids below
  # Pinned to efficiency cores for management tasks
  embedder:
    build:
      context: ../src/embedder
    # GPU configuration (uncomment if EMBEDDER_GPU_IDS is set):
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ${EMBEDDER_GPU_IDS}
    #           capabilities: [gpu]
    cpuset: "0-9"
    shm_size: "16gb"
    ports:
      - "${PORT_EMBEDDER}:30010"
    environment:
      - EMBEDDER_MODEL_ID=${EMBEDDER_MODEL_ID:-${EMBEDDING_MODEL_PATH:-nvidia/nv-embedqa-e5-v5}}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${EMBEDDER_GPU_IDS:-}
      - HF_HOME=/raid/vyasa/hf_cache
    volumes:
      - /raid/vyasa/hf_cache:/raid/vyasa/hf_cache
      - /raid/vyasa/model_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/30010"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reranker service: NeMo Retriever Text Reranking NIM
  # - Model: nvidia/llama-3.2-nv-rerankqa-1b-v2
  # - Purpose: Refine top-K retrieval results to top-M evidence packets
  # - GPU: Defaults to CPU (no GPU pinning) to avoid VRAM contention
  #   To enable GPU: Set RERANKER_GPU_IDS in .env and uncomment runtime/device_ids below
  reranker:
    build:
      context: ../src/reranker
    # GPU configuration (uncomment if RERANKER_GPU_IDS is set):
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ${RERANKER_GPU_IDS}
    #           capabilities: [gpu]
    cpuset: "0-9"
    shm_size: "16gb"
    ports:
      - "${PORT_RERANKER:-30011}:30011"
    environment:
      - RERANKER_MODEL_ID=${RERANKER_MODEL_ID:-nvidia/llama-3.2-nv-rerankqa-1b-v2}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${RERANKER_GPU_IDS:-}
      - HF_HOME=/raid/vyasa/hf_cache
    volumes:
      - /raid/vyasa/hf_cache:/raid/vyasa/hf_cache
      - /raid/vyasa/model_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/30011"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Orchestrator (agentic workflow API)
  orchestrator:
    image: ${ORCHESTRATOR_IMAGE}
    working_dir: /app
    # Install Python packages from orchestrator-specific requirements, then run uvicorn
    # Note: Uses requirements-orchestrator.txt which excludes sglang (orchestrator uses HTTP only)
    command: ["/app/deploy/scripts/orchestrator-setup.sh"]
    cpuset: "0-9"
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
      - ../requirements-orchestrator.txt:/app/requirements-orchestrator.txt:ro
      - ../requirements.txt:/app/requirements.txt:ro
      - ./scripts:/app/deploy/scripts:ro
      - ./scripts/orchestrator-setup.sh:/app/deploy/scripts/orchestrator-setup.sh:ro
      - ./forbidden_vocab.yaml:/app/deploy/forbidden_vocab.yaml:ro
      - ./neutral_tone.yaml:/app/deploy/neutral_tone.yaml:ro
      - ./rigor_policy.yaml:/app/deploy/rigor_policy.yaml:ro
      - /raid/vyasa/telemetry:/raid/telemetry
      - /raid/vyasa/scratch:/raid/scratch
    environment:
      - BRAIN_URL=http://cortex-brain:30000
      - WORKER_URL=http://cortex-worker:30001
      - VISION_URL=http://cortex-vision:30002
      - MEMORY_URL=http://graph:${PORT_MEMORY}
      - VECTOR_URL=http://vector:${PORT_VECTOR}
      - FIRECRAWL_SERVICE_URL=${FIRECRAWL_SERVICE_URL:-http://firecrawl:3002}
      - ARANGODB_DB=${GRAPH_DB_NAME}
      - ARANGODB_USER=${ARANGODB_USER}
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
      - ARANGODB_PASSWORD=${ARANGO_ROOT_PASSWORD}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_FORMAT=json
    depends_on:
      - cortex-brain
      - cortex-worker
      - graph
      - vector
      # Note: cortex-vision is optional (profiles: ["vision"])
      # Orchestrator handles vision unavailability gracefully via VISION_ENABLED config
    networks:
      - vyasa-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Firecrawl - Web scraping sidecar (CPU-only, optional)
  # HTTP-only integration preserves AGPL boundaries (no SDK imports in Vyasa core)
  # Used for web augmentation when WEB_AUGMENTATION_ENABLED=true
  # Note: Firecrawl includes Playwright internally; no separate browser service needed
  # IMPORTANT: Firecrawl does not ship a stable public Docker image.
  # Build locally from canonical repo: https://github.com/firecrawl/firecrawl
  # Recommended: Pin to a specific commit for reproducibility
  # Example: git clone https://github.com/firecrawl/firecrawl.git && cd firecrawl && git checkout <commit> && docker build -t firecrawl:local .
  # Then set FIRECRAWL_IMAGE=firecrawl:local in deploy/.env
  firecrawl:
    profiles:
      - firecrawl
    # FIRECRAWL_IMAGE must be set when using --firecrawl flag
    # Build locally: git clone https://github.com/firecrawl/firecrawl.git && docker build -t firecrawl:local .
    image: ${FIRECRAWL_IMAGE}
    cpuset: "0-9"
    mem_limit: "4g"
    ports:
      - "${FIRECRAWL_PORT:-3002}:3002"
    environment:
      - PORT=3002
    networks:
      - vyasa-net
    restart: unless-stopped
    healthcheck:
      # Try /health endpoint first, fallback to scraping endpoint test
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || curl -f http://localhost:3002/v0/scrape -X POST -H 'Content-Type: application/json' -d '{\"url\":\"https://example.com\"}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  vyasa-net:
    name: vyasa-net
    external: true
    # Network is created by run_stack.sh before starting services
    # Setting external: true prevents compose from trying to manage it

volumes:
  memory_data:
  qdrant_data:
  console_node_modules:
